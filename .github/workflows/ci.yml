name: Clean source verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer regression tests
        run: python -m unittest discover -s tests -v
      - name: Build backend without credentials or media
        run: docker build -t cutroom-api ./services/api
      - name: Backend tests and lint
        run: docker run --rm -v "$PWD/services/api/tests:/app/tests:ro" cutroom-api sh -c "pytest -q && ruff check app tests"
      - name: Build frontend
        run: docker build -t cutroom-web ./apps/web
      - name: Frontend tests, lint, and production build
        run: docker run --rm cutroom-web sh -c "npm run lint && npm test && npm run build"
